name: Deploy demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run build:demo
      - name: Stage static site
        run: |
          mkdir -p staging/packages/crystal-demo
          mkdir -p staging/packages/crystal-viewer/bundle
          mkdir -p staging/packages/crystal-core/test-fixtures/m5
          cp packages/crystal-demo/*.html staging/packages/crystal-demo/
          cp -r packages/crystal-viewer/bundle/* staging/packages/crystal-viewer/bundle/
          cp packages/crystal-core/test-fixtures/m5/*.cif staging/packages/crystal-core/test-fixtures/m5/
          # Root redirect to the demo index
          cat > staging/index.html <<'HTML'
          <!DOCTYPE html>
          <meta http-equiv="refresh" content="0; url=packages/crystal-demo/index.html">
          <a href="packages/crystal-demo/index.html">Demos</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: staging
      - id: deployment
        uses: actions/deploy-pages@v4
