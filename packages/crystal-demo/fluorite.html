<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fluorite — M2 Demo</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #2a2a2a; color: #ddd; display: flex; height: 100vh; }
  #panel { width: 320px; padding: 16px; overflow-y: auto; background: #333; border-right: 1px solid #555; }
  #panel h1 { font-size: 1.2em; margin: 0 0 4px; }
  #panel .formula { color: #999; font-size: 0.85em; margin-bottom: 12px; }
  #panel h2 { font-size: 0.95em; margin: 16px 0 6px; color: #ccc; border-bottom: 1px solid #555; padding-bottom: 2px; }
  #panel label { display: block; margin-bottom: 8px; font-size: 0.85em; }
  #panel select { width: 100%; margin-bottom: 8px; }
  #panel .form-row { margin-bottom: 10px; }
  #panel .form-row .label-line { display: flex; justify-content: space-between; font-size: 0.82em; }
  #panel input[type="range"] { width: 100%; }
  #panel .value { color: #8cf; font-variant-numeric: tabular-nums; }
  #panel .status { margin-top: 12px; padding: 8px; border-radius: 4px; font-size: 0.82em; }
  #panel .status.valid { background: #2d4a2d; color: #8e8; }
  #panel .status.invalid { background: #4a2d2d; color: #e88; }
  #panel .status.stale { background: #4a4a2d; color: #dd8; }
  #canvas-container { flex: 1; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  .hint { position: absolute; bottom: 8px; right: 12px; font-size: 0.75em; color: #888; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../../node_modules/three/build/three.module.js",
    "@crystal/core": "../crystal-core/dist/index.js",
    "@crystal/data": "../crystal-data/dist/index.js",
    "@crystal/three": "../crystal-three/dist/index.js",
    "@crystal/viewer": "../crystal-viewer/dist/index.js"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h1 id="mineral-name">Fluorite</h1>
  <div class="formula" id="mineral-formula">CaF₂ — Cubic</div>

  <h2>Habit</h2>
  <select id="habit-select"></select>

  <h2>Forms</h2>
  <div id="forms"></div>

  <button type="button" id="reset-camera">Reset camera</button>

  <div class="status" id="status">Loading…</div>
</div>
<div id="canvas-container">
  <canvas id="canvas"></canvas>
  <span class="hint">Drag to rotate</span>
</div>

<script type="module">
import { CrystalViewer } from "@crystal/viewer";

const canvas = document.getElementById("canvas");
const viewer = new CrystalViewer(canvas);
await viewer.loadMineral("fluorite");
viewer.start();
document.getElementById("reset-camera").addEventListener("click", () => viewer.resetCamera());

// Habit selector
const habitSelect = document.getElementById("habit-select");
function populateHabits() {
  const habits = viewer.getHabits();
  habitSelect.innerHTML = "";
  for (const h of habits) {
    const opt = document.createElement("option");
    opt.value = h.id;
    opt.textContent = h.name;
    habitSelect.appendChild(opt);
  }
  const current = viewer.getHabitId();
  if (current) habitSelect.value = current;
}
habitSelect.addEventListener("change", () => {
  viewer.setHabit(habitSelect.value);
  populateForms();
  updateStatus();
});

// Form sliders
const formsContainer = document.getElementById("forms");
function populateForms() {
  formsContainer.innerHTML = "";
  const forms = viewer.getForms();
  for (const form of forms) {
    const row = document.createElement("div");
    row.className = "form-row";
    const labelLine = document.createElement("div");
    labelLine.className = "label-line";
    labelLine.innerHTML = `<span>${form.label}</span><span class="value" id="val-${form.id}">${form.development.toFixed(2)}</span>`;
    row.appendChild(labelLine);
    const slider = document.createElement("input");
    slider.type = "range";
    slider.min = "0";
    slider.max = "1";
    slider.step = "0.01";
    slider.value = String(form.development);
    slider.disabled = !form.enabled;
    slider.addEventListener("input", () => {
      const val = parseFloat(slider.value);
      viewer.setFormDevelopment(form.id, val);
      document.getElementById("val-" + form.id).textContent = val.toFixed(2);
      updateStatus();
    });
    row.appendChild(slider);
    formsContainer.appendChild(row);
  }
}

// Geometry status display
const statusEl = document.getElementById("status");
function updateStatus() {
  const s = viewer.getGeometryStatus();
  statusEl.className = "status " + (s.stale ? "stale" : s.status);
  if (s.status === "valid" && !s.stale) {
    statusEl.textContent = "Valid geometry";
  } else if (s.stale) {
    statusEl.textContent = "Invalid — showing previous valid shape";
  } else {
    const codes = s.diagnostics.map(d => d.code).join(", ");
    statusEl.textContent = "Invalid: " + (codes || "unknown");
  }
}

// Listen for viewer events to keep controls synchronized
viewer.addEventListener("geometry-changed", () => updateStatus());
viewer.addEventListener("geometry-invalid", () => updateStatus());

// Initialize
populateHabits();
populateForms();
updateStatus();

// Resize handling
function resize() {
  const container = document.getElementById("canvas-container");
  viewer.resize(container.clientWidth, container.clientHeight);
}
window.addEventListener("resize", resize);
resize();
</script>
</body>
</html>
