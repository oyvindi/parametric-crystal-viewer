<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generic Surface Detail — SR4 Comparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: #25282c; color: #eee; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; padding: 12px 18px; background: #30343a; border-bottom: 1px solid #555; }
  h1 { margin: 0 auto 0 0; font-size: 1.05rem; }
  label { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
  select { min-width: 130px; }
  input[type="range"] { width: 150px; }
  output { min-width: 2.5em; color: #9dd5ff; font-variant-numeric: tabular-nums; }
  button { padding: 4px 10px; }
  main { min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .view { position: relative; min-width: 0; overflow: hidden; }
  .view + .view { border-left: 1px solid #777; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .badge { position: absolute; z-index: 1; top: 14px; left: 14px; padding: 8px 11px; background: rgb(20 22 25 / 78%); border-radius: 4px; pointer-events: none; }
  .badge strong { display: block; }
  .badge span { color: #c4c9cf; font-size: .76rem; }
  .hint { position: fixed; left: 50%; bottom: 12px; translate: -50%; z-index: 2; padding: 5px 9px; border-radius: 4px; background: rgb(20 22 25 / 74%); color: #c4c9cf; font-size: .75rem; pointer-events: none; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } .view + .view { border-left: 0; border-top: 1px solid #777; } }
</style>
<script type="importmap">
{
  "imports": {
    "@crystal/viewer": "../crystal-viewer/bundle/index.mjs",
    "@crystal/viewer/component": "../crystal-viewer/bundle/component.mjs"
  }
}
</script>
</head>
<body>
<header>
  <h1>SR4 Generic Surface Detail</h1>
  <label>Mineral <select id="mineral"></select></label>
  <label>Enabled strength <input id="strength" type="range" min="0" max="1" step="0.01" value="0.35"><output id="strength-value">0.35</output></label>
  <button id="reset" type="button">Reset shared view</button>
</header>
<main>
  <section class="view" id="off-view">
    <div class="badge"><strong>Detail off</strong><span>Unmodified physical material</span></div>
    <canvas id="off-canvas"></canvas>
  </section>
  <section class="view" id="on-view">
    <div class="badge"><strong>Detail enabled</strong><span id="on-description">Generic strength 0.35</span></div>
    <canvas id="on-canvas"></canvas>
  </section>
</main>
<div class="hint">Drag either crystal — rotation is mirrored on both sides</div>

<script type="module">
import { CrystalViewer, getMineral, listMinerals } from "@crystal/viewer";

const offCanvas = document.getElementById("off-canvas");
const onCanvas = document.getElementById("on-canvas");
const offViewer = new CrystalViewer(offCanvas);
const onViewer = new CrystalViewer(onCanvas);
const mineralSelect = document.getElementById("mineral");
const strengthInput = document.getElementById("strength");
const strengthValue = document.getElementById("strength-value");
const onDescription = document.getElementById("on-description");

for (const id of listMinerals()) {
  const option = document.createElement("option");
  option.value = id;
  option.textContent = getMineral(id).name;
  mineralSelect.appendChild(option);
}

function strength() { return Number(strengthInput.value); }

async function load(id) {
  await Promise.all([offViewer.loadMineral(id), onViewer.loadMineral(id)]);
  offViewer.setSurfaceDetail(false, strength());
  onViewer.setSurfaceDetail(true, strength());
  offViewer.resetCamera();
  onViewer.resetCamera();
}

function updateStrength() {
  const value = strength();
  strengthValue.value = value.toFixed(2);
  onDescription.textContent = `Generic strength ${value.toFixed(2)}`;
  offViewer.setSurfaceDetail(false, value);
  onViewer.setSurfaceDetail(true, value);
}

// CrystalViewer owns rotation on the canvas being dragged. Mirror the exact
// same relative deltas onto its peer so both cameras remain directly comparable.
function mirrorPointer(sourceCanvas, peerViewer) {
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  sourceCanvas.addEventListener("pointerdown", (event) => {
    dragging = true;
    lastX = event.clientX;
    lastY = event.clientY;
  });
  sourceCanvas.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    const dx = event.clientX - lastX;
    const dy = event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    peerViewer.rotateModel(dy * 0.01, dx * 0.01);
  });
  const stop = () => { dragging = false; };
  sourceCanvas.addEventListener("pointerup", stop);
  sourceCanvas.addEventListener("pointercancel", stop);
  sourceCanvas.addEventListener("pointerleave", stop);
}

mirrorPointer(offCanvas, onViewer);
mirrorPointer(onCanvas, offViewer);

// This comparison is about material response. Prevent the viewer's face-picking
// click handler from tinting only one side after a drag or click.
for (const canvas of [offCanvas, onCanvas]) {
  canvas.addEventListener("click", (event) => event.stopImmediatePropagation(), { capture: true });
}

function resize() {
  for (const [element, viewer] of [[document.getElementById("off-view"), offViewer], [document.getElementById("on-view"), onViewer]]) {
    viewer.resize(element.clientWidth, element.clientHeight);
  }
}

mineralSelect.addEventListener("change", () => load(mineralSelect.value));
strengthInput.addEventListener("input", updateStrength);
document.getElementById("reset").addEventListener("click", () => { offViewer.resetCamera(); onViewer.resetCamera(); });
window.addEventListener("resize", resize);

mineralSelect.value = "quartz";
resize();
await load(mineralSelect.value);
await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
offViewer.render();
onViewer.render();
document.documentElement.dataset.demoReady = "true";
</script>
</body>
</html>
