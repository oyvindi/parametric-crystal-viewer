<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<title>Basic Embedding — M7 Demo</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body class="cv-embedding">
<h1>Basic Embedding — two independent instances</h1>
<div class="note">Plain-HTML embedding of the <code>&lt;crystal-viewer&gt;</code> Web Component, no framework. Each instance loads a different mineral via the <code>mineral</code> attribute and is independently draggable.</div>
<div class="demo-row">
  <div class="cell">
    <h2>Quartz</h2>
    <crystal-viewer mineral="quartz"></crystal-viewer>
  </div>
  <div class="cell">
    <h2>Fluorite</h2>
    <crystal-viewer mineral="fluorite"></crystal-viewer>
  </div>
</div>
<script type="module">
import { defineCrystalViewerElement } from "@crystal/viewer/component";
import { installProjectionControl } from "./projection-control.js";
defineCrystalViewerElement();

// Start the render loops for each instance.
const viewers = await Promise.all([...document.querySelectorAll("crystal-viewer")].map(async (el) => {
  await new Promise((r) => requestAnimationFrame(r));
  const viewer = el.getViewer();
  if (viewer) viewer.start();
  return viewer;
}));
installProjectionControl(viewers.filter(Boolean));
</script>
</body>
</html>
