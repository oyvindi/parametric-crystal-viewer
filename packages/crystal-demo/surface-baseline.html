<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surface baseline</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body class="cv-baseline">
<canvas id="canvas" width="960" height="720"></canvas>
<div id="caption"><strong id="name">Loading…</strong><span id="details"></span></div>
<output id="surface-baseline-result" hidden></output>
<script type="module">
import { CrystalViewer, getMineral, listMinerals } from "@crystal/viewer";
import { installProjectionControl } from "./projection-control.js";

const params = new URLSearchParams(location.search);
const mineralId = params.get("mineral") ?? "quartz";
if (!listMinerals().includes(mineralId)) throw new Error(`Unknown mineral: ${mineralId}`);

const canvas = document.getElementById("canvas");
const viewer = new CrystalViewer(canvas);
installProjectionControl([viewer]);
viewer.resize(960, 720);
viewer.setEnvironmentIntensity(1);
viewer.setEnvironmentRotation(0, 0, 0);
viewer.setEnvironmentBackgroundVisible(true);
viewer.setEnvironmentBackgroundZoom(1);
viewer.setToneMapping("agx");
viewer.setExposure(1);
await viewer.loadMineral(mineralId);
if (params.has("surfaceDetail")) viewer.setSurfaceDetail(true, Number(params.get("surfaceDetail")));
viewer.resetCamera();

const mineral = getMineral(mineralId);
document.getElementById("name").textContent = mineral.name;
document.getElementById("details").textContent =
  `${viewer.getHabitId()} · ${viewer.getAppearanceId() ?? "default material"}`;

const result = { mineralId, habitId: viewer.getHabitId(), appearanceId: viewer.getAppearanceId(), surfaceDetail: viewer.getSurfaceDetail() };
if (params.get("timing") === "1") {
  const samples = [];
  let sampling = true;
  let previous;
  function sample(now) {
    if (!sampling) return;
    if (previous !== undefined) samples.push(now - previous);
    previous = now;
    requestAnimationFrame(sample);
  }
  viewer.start();
  requestAnimationFrame(sample);
  await new Promise(resolve => setTimeout(resolve, 1000));
  sampling = false;
  viewer.stop();
  samples.sort((a, b) => a - b);
  const mean = samples.reduce((sum, value) => sum + value, 0) / samples.length;
  Object.assign(result, {
    frames: samples.length,
    meanFrameMs: Number(mean.toFixed(3)),
    medianFrameMs: Number(samples[Math.floor(samples.length / 2)].toFixed(3)),
    p95FrameMs: Number(samples[Math.floor(samples.length * 0.95)].toFixed(3)),
  });
}
document.getElementById("surface-baseline-result").textContent = JSON.stringify(result);
document.documentElement.dataset.baselineReady = "true";
</script>
</body>
</html>
