<!doctype html>
<html lang="en" data-bs-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Viewer — CIF Morphology</title>
<link rel="stylesheet" href="./demo.css">
</head>
<body class="cv-cif-morph"><aside><h1>CIF crystal morphology</h1><p>Upload a CIF with measured <code>_exptl_crystal_face_*</code> data. If absent, the demo shows a theoretical BFDH morphology derived from the unit cell and symmetry. It does not render atoms.</p><input id="file" type="file" accept=".cif,text/plain"><div id="status">Waiting for a CIF.</div><div id="info">No source metadata loaded.</div></aside><main><canvas id="canvas"></canvas></main>
<script type="module">
import { CrystalViewer } from "@crystal/viewer";
import { installProjectionControl } from "./projection-control.js";
const canvas=document.getElementById("canvas"),status=document.getElementById("status"),info=document.getElementById("info"),viewer=new CrystalViewer(canvas);installProjectionControl([viewer]);viewer.start();
function updateInfo(){const s=viewer.getStructureInfo();if(!s){info.textContent="No source metadata loaded.";return;}const rows=[["Mineral",s.mineralName||s.name],["Formula",s.formula||"—"],["Authors",s.authors?.join(", ")||"—"],["Publication",s.publicationTitle||"—"]];info.innerHTML=rows.map(([k,v])=>`<strong>${k}:</strong> ${v}`).join("<br>");}
document.getElementById("file").addEventListener("change",async event=>{const file=event.target.files?.[0];if(!file)return;const diagnostics=viewer.loadCifMorphology(await file.text());status.className=diagnostics.some(d=>d.severity==="error")?"error":"ok";status.textContent=diagnostics.length?diagnostics.map(d=>`[${d.code}] ${d.message}`).join("\n"):"Morphology loaded successfully.";updateInfo();});
function resize(){viewer.resize(canvas.parentElement.clientWidth,canvas.parentElement.clientHeight)}window.addEventListener("resize",resize);resize();
</script></body></html>
