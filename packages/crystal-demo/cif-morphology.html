<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Viewer — CIF Morphology</title>
<style>
body{margin:0;display:flex;min-height:100vh;background:#202326;color:#ddd;font:15px system-ui,sans-serif}aside{width:300px;padding:18px;box-sizing:border-box;background:#2d3034}h1{font-size:1.2rem;margin:0 0 8px}p{color:#aaa;font-size:.85rem;line-height:1.45}input{width:100%;margin:12px 0}#status,#info{white-space:pre-wrap;margin-top:16px;padding:9px;background:#24272a;font-size:.8rem}#info{line-height:1.5}.ok{color:#9fdaaa}.error{color:#ffaaa8}main{flex:1;min-width:0}canvas{display:block;width:100%;height:100vh}
</style><script type="importmap">{"imports":{"three":"../../node_modules/three/build/three.module.js","three/addons/":"../../node_modules/three/examples/jsm/","@crystal/core":"../crystal-core/dist/index.js","@crystal/data":"../crystal-data/dist/index.js","@crystal/three":"../crystal-three/dist/index.js","@crystal/viewer":"../crystal-viewer/dist/index.js"}}</script></head>
<body><aside><h1>CIF crystal morphology</h1><p>Upload a CIF with measured <code>_exptl_crystal_face_*</code> data. If absent, the demo shows a theoretical BFDH morphology derived from the unit cell and symmetry. It does not render atoms.</p><input id="file" type="file" accept=".cif,text/plain"><div id="status">Waiting for a CIF.</div><div id="info">No source metadata loaded.</div></aside><main><canvas id="canvas"></canvas></main>
<script type="module">
import { CrystalViewer } from "@crystal/viewer";
const canvas=document.getElementById("canvas"),status=document.getElementById("status"),info=document.getElementById("info"),viewer=new CrystalViewer(canvas);viewer.start();
function updateInfo(){const s=viewer.getStructureInfo();if(!s){info.textContent="No source metadata loaded.";return;}const rows=[["Mineral",s.mineralName||s.name],["Formula",s.formula||"—"],["Authors",s.authors?.join(", ")||"—"],["Publication",s.publicationTitle||"—"]];info.innerHTML=rows.map(([k,v])=>`<strong>${k}:</strong> ${v}`).join("<br>");}
document.getElementById("file").addEventListener("change",async event=>{const file=event.target.files?.[0];if(!file)return;const diagnostics=viewer.loadCifMorphology(await file.text());status.className=diagnostics.some(d=>d.severity==="error")?"error":"ok";status.textContent=diagnostics.length?diagnostics.map(d=>`[${d.code}] ${d.message}`).join("\n"):"Morphology loaded successfully.";updateInfo();});
function resize(){viewer.resize(canvas.parentElement.clientWidth,canvas.parentElement.clientHeight)}window.addEventListener("resize",resize);resize();
</script></body></html>
